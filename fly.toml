# The account pool on Fly, apart from hex's machines. Its config, account logins and run state live on the volume,
# which is HOME; the image holds only the binary.
app = "broadcom-pool"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30
swap_size_mb = 1024

[env]
  HOME = "/data"
  TZ = "America/Los_Angeles"
  GOMEMLIMIT = "1500MiB"

[experimental]
  cmd = ["/CLIProxyAPI/CLIProxyAPI", "-config", "/data/.config/cliproxyapi/config.yaml"]

[mounts]
  source = "pool"
  destination = "/data"

[http_service]
  internal_port = 8317
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 1000
  [http_service.http_options]
    idle_timeout = 600
  [[http_service.checks]]
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
